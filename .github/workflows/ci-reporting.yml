name: CI reporting

on:
  workflow_call:

defaults:
  run:
    shell: bash

permissions: { }

jobs:
  setup:
    name: Resolve configuration
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      pull-requests: read
    outputs:
      build-scans: ${{ steps.config.outputs.build-scans }}
      sonar: ${{ steps.config.outputs.sonar }}
      docs-preview: ${{ steps.config.outputs.docs-preview }}
      build-system: ${{ steps.config.outputs.build-system }}
      java-version: ${{ steps.config.outputs.java-version }}
      gradle-args: ${{ steps.config.outputs.gradle-args }}
      maven-args: ${{ steps.config.outputs.maven-args }}
      sonar-java-libraries: ${{ steps.config.outputs.sonar-java-libraries }}
      sonar-coverage-report: ${{ steps.config.outputs.sonar-coverage-report }}
      sonar-project-key: ${{ steps.config.outputs.sonar-project-key }}
      build-scan-artifact-pattern: ${{ steps.config.outputs.build-scan-artifact-pattern }}
      sonar-artifact-pattern: ${{ steps.config.outputs.sonar-artifact-pattern }}
      docs-preview-links: ${{ steps.config.outputs.docs-preview-links }}
      is-pull-request: ${{ steps.pr-info.outputs.is-pull-request }}
      pr-number: ${{ steps.pr-info.outputs.pr-number }}
      head-sha: ${{ steps.pr-info.outputs.head-sha }}
      head-sha-full: ${{ steps.pr-info.outputs.head-sha-full }}
      target-branch: ${{ steps.pr-info.outputs.target-branch }}
      head-branch: ${{ steps.pr-info.outputs.head-branch }}
      check-run-id: ${{ steps.create-check.outputs.check-run-id }}
    steps:
      - name: Determine PR info
        id: pr-info
        uses: hibernate/.github/actions/determine-pr-info@865fcd72c2399d04a2e8a08b6d7e18ae39180975

      - name: Resolve feature flags and settings
        id: config
        uses: hibernate/.github/actions/resolve-ci-config@865fcd72c2399d04a2e8a08b6d7e18ae39180975
        with:
          repository: ${{ github.event.workflow_run.repository.full_name }}
          branch: ${{ steps.pr-info.outputs.target-branch }}

      - name: Create in-progress check run
        id: create-check
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          HEAD_SHA: ${{ steps.pr-info.outputs.head-sha-full }}
          REPORTING_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { data } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: process.env.HEAD_SHA,
              name: 'CI Reporting Summary',
              status: 'in_progress',
              output: {
                title: 'CI reporting in progress…',
                summary: `[View reporting workflow run](${process.env.REPORTING_WORKFLOW_URL})`,
              },
            });
            core.setOutput('check-run-id', data.id);

  publish-build-scans:
    name: Publish Develocity build scans
    needs: setup
    if: needs.setup.outputs.build-scans == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      published: ${{ steps.publish-gradle.outputs.published || steps.publish-maven.outputs.published || '0' }}
      failed: ${{ steps.publish-gradle.outputs.failed || steps.publish-maven.outputs.failed || '0' }}
      scan-report: ${{ steps.publish-gradle.outputs.scan-report || steps.publish-maven.outputs.scan-report }}
    steps:
      - name: Check out target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.event.workflow_run.repository.full_name }}
          ref: ${{ needs.setup.outputs.target-branch }}

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: ${{ needs.setup.outputs.java-version }}

      - name: Download build scan artifacts
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ needs.setup.outputs.build-scan-artifact-pattern }}
          github-token: ${{ github.token }}
          repository: ${{ github.event.workflow_run.repository.full_name }}
          run-id: ${{ github.event.workflow_run.id }}
          path: /tmp/downloaded-build-scan-data/
        continue-on-error: true

      - name: Publish build scans (Gradle)
        id: publish-gradle
        if: steps.download.outcome == 'success' && needs.setup.outputs.build-system == 'gradle'
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY_PR }}
          COMMON_GRADLE_ARGS: ${{ needs.setup.outputs.gradle-args }}
        run: |
          shopt -s nullglob
          read -ra gradle_args <<< "$COMMON_GRADLE_ARGS"
          published=0
          failed=0
          scan_report=""
          mkdir -p ~/.gradle/
          for build_scan_data_directory in /tmp/downloaded-build-scan-data/*
          do
            rm -rf ~/.gradle/build-scan-data
            mv "$build_scan_data_directory" ~/.gradle/build-scan-data
            job_name=$(basename "$build_scan_data_directory")
            if output=$(./gradlew "${gradle_args[@]}" --no-build-cache buildScanPublishPrevious 2>&1); then
              echo "$output"
              published=$((published + 1))
              url=$(echo "$output" | grep -A1 'Publishing Build Scan' | grep -oE 'https://[^ ]+/s/[a-z0-9]+' | head -1)
              if [ -n "$url" ]; then
                scan_report="${scan_report}- [${job_name}](${url})"$'\n'
              else
                scan_report="${scan_report}- ${job_name}"$'\n'
              fi
            else
              echo "$output"
              echo "::warning::Failed to publish build scan from $job_name"
              failed=$((failed + 1))
            fi
          done
          echo "::notice::Published $published build scan(s), $failed failed"
          {
            echo "published=$published"
            echo "failed=$failed"
            echo "scan-report<<EOF"
            printf '%s' "$scan_report"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish build scans (Maven)
        id: publish-maven
        if: steps.download.outcome == 'success' && needs.setup.outputs.build-system == 'maven'
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY_PR }}
          MAVEN_ARGS: ${{ needs.setup.outputs.maven-args }}
        run: |
          shopt -s nullglob
          read -ra mvn_args <<< "$MAVEN_ARGS"
          published=0
          failed=0
          scan_report=""
          mkdir -p ~/.m2/.develocity/
          for build_scan_data_directory in /tmp/downloaded-build-scan-data/*
          do
            rm -rf ~/.m2/.develocity/build-scan-data
            job_name=$(basename "$build_scan_data_directory")
            if ! mv "$build_scan_data_directory" ~/.m2/.develocity/build-scan-data; then
              echo "::warning::Failed to move build scan data from $job_name"
              failed=$((failed + 1))
              continue
            fi
            if output=$(./mvnw "${mvn_args[@]}" develocity:build-scan-publish-previous 2>&1); then
              echo "$output"
              published=$((published + 1))
              url=$(echo "$output" | grep -A1 'Publishing Build Scan' | grep -oE 'https://[^ ]+/s/[a-z0-9]+' | head -1)
              if [ -n "$url" ]; then
                scan_report="${scan_report}- [${job_name}](${url})"$'\n'
              else
                scan_report="${scan_report}- ${job_name}"$'\n'
              fi
            else
              echo "$output"
              echo "::warning::Failed to publish build scan from $job_name"
              failed=$((failed + 1))
            fi
          done
          echo "::notice::Published $published build scan(s), $failed failed"
          {
            echo "published=$published"
            echo "failed=$failed"
            echo "scan-report<<EOF"
            printf '%s' "$scan_report"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ "$failed" -gt 0 ]; then
            exit 1
          fi

  publish-sonar:
    name: Publish Sonar scan
    needs: setup
    if: needs.setup.outputs.sonar == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      sonar-url: ${{ steps.analyze.outputs.sonar-url }}
    steps:
      - name: Check out target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.event.workflow_run.repository.full_name }}
          ref: ${{ needs.setup.outputs.target-branch }}
          fetch-depth: 0

      - name: Check out PR code
        if: needs.setup.outputs.is-pull-request == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.setup.outputs.pr-number }}
        run: |
          gh pr checkout "$PR_NUMBER"
          # Remove build wrappers so we don't accidentally run a build
          rm -rf gradlew* mvnw*

      - name: Remove build wrappers (push)
        if: needs.setup.outputs.is-pull-request == 'false'
        run: rm -rf gradlew* mvnw*

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: ${{ needs.setup.outputs.java-version }}

      - name: Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ needs.setup.outputs.sonar-artifact-pattern }}
          github-token: ${{ github.token }}
          repository: ${{ github.event.workflow_run.repository.full_name }}
          run-id: ${{ github.event.workflow_run.id }}
          path: .
          merge-multiple: 'true'
        continue-on-error: true

      - name: Install Sonar CLI
        run: |
          SONAR_HASH="8fbfb1eb546b734a60fc3e537108f06e389a8ca124fbab3a16236a8a51edcc15"
          SONAR_SCANNER_VERSION="8.0.1.6346"
          curl --create-dirs --fail -sSLo "$HOME/.sonar/sonar-scanner.zip" \
            "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$SONAR_SCANNER_VERSION.zip"
          DOWNLOADED_HASH=$(sha256sum "$HOME/.sonar/sonar-scanner.zip" | awk '{print $1}')
          if [ "$DOWNLOADED_HASH" != "$SONAR_HASH" ]; then
            echo "::error::Sonar scanner checksum mismatch. Expected: $SONAR_HASH, got: $DOWNLOADED_HASH"
            exit 1
          fi
          unzip -o "$HOME/.sonar/sonar-scanner.zip" -d "$HOME/.sonar/"
          mv "$HOME/.sonar/sonar-scanner-$SONAR_SCANNER_VERSION"/* "$HOME/.sonar/"

      - name: Sonar Analysis
        id: analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          REPO_FULL_NAME: ${{ github.event.workflow_run.repository.full_name }}
          SONAR_PROJECT_KEY: ${{ needs.setup.outputs.sonar-project-key }}
          IS_PULL_REQUEST: ${{ needs.setup.outputs.is-pull-request }}
          HEAD_BRANCH: ${{ needs.setup.outputs.head-branch }}
          PR_NUMBER: ${{ needs.setup.outputs.pr-number }}
          TARGET_BRANCH: ${{ needs.setup.outputs.target-branch }}
          SONAR_JAVA_LIBRARIES: ${{ needs.setup.outputs.sonar-java-libraries }}
          SONAR_COVERAGE_REPORT: ${{ needs.setup.outputs.sonar-coverage-report }}
        run: |
          find . -name "*.exec" -type f

          EXTRA_ARGS=()
          if [ "$IS_PULL_REQUEST" = "true" ]; then
            EXTRA_ARGS=(
              "-Dsonar.pullrequest.branch=$HEAD_BRANCH"
              "-Dsonar.pullrequest.key=$PR_NUMBER"
              "-Dsonar.pullrequest.base=$TARGET_BRANCH"
              "-Dsonar.pullrequest.provider=GitHub"
              "-Dsonar.pullrequest.github.repository=$REPO_FULL_NAME"
            )
          else
            EXTRA_ARGS=("-Dsonar.branch.name=$HEAD_BRANCH")
          fi

          sonar_output=$("$HOME/.sonar/bin/sonar-scanner" "${EXTRA_ARGS[@]}" \
            -Dsonar.host.url="https://sonarcloud.io" \
            -Dsonar.organization="hibernate" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.java.libraries="$(pwd)/$SONAR_JAVA_LIBRARIES" \
            -Dsonar.coverage.jacoco.xmlReportPaths="$(pwd)/$SONAR_COVERAGE_REPORT" \
            2>&1) && sonar_status=0 || sonar_status=$?
          echo "$sonar_output"
          echo "sonar-url=$(echo "$sonar_output" | grep 'ANALYSIS SUCCESSFUL' | grep -oE 'https://\S+' | head -1)" >> "$GITHUB_OUTPUT"
          exit "$sonar_status"

  deploy-docs-preview:
    name: Deploy docs preview
    needs: setup
    if: needs.setup.outputs.docs-preview == 'true' && needs.setup.outputs.is-pull-request == 'true'
    concurrency:
      group: docs-preview-${{ github.event.workflow_run.repository.full_name }}-${{ needs.setup.outputs.pr-number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    outputs:
      deploy-url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Download documentation artifact
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-preview
          path: ./docs-preview/
          github-token: ${{ github.token }}
          repository: ${{ github.event.repository.full_name }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Deploy to Surge
        if: steps.download.outcome == 'success'
        id: deploy
        shell: bash
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_PREVIEW_TOKEN }}
          DEPLOY_DOMAIN: "${{ github.event.repository.name }}-pr-${{ needs.setup.outputs.pr-number }}-preview.surge.sh"
        run: |
          npx --ignore-scripts surge@0.31.1 ./docs-preview/ "https://${DEPLOY_DOMAIN}"
          echo "url=https://$DEPLOY_DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Build doc index links
        if: steps.download.outcome == 'success' && steps.deploy.outcome == 'success'
        id: links
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          SHOW_LINKS: ${{ needs.setup.outputs.docs-preview-links }}
        run: |
          if [ "$SHOW_LINKS" != "true" ]; then
            printf 'doc-links= - [Home](%s)\n' "$DEPLOY_URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LINKS=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            rel_path="${file#./docs-preview/}"
            dir_path=$(dirname "$rel_path")
            if [ "$dir_path" = "." ]; then
              label="Home"
            else
              top_dir="${dir_path%%/*}"
              label=$(echo "$top_dir" | sed 's/[-_]/ /g; s/\b\w/\U&/g')
            fi
            LINKS="${LINKS}- [${label}](${DEPLOY_URL}/${rel_path})"$'\n'
          done < <(find ./docs-preview -name 'index.html' -type f | sort)

          if [ -z "$LINKS" ]; then
            LINKS="${DEPLOY_URL}"$'\n'
          fi

          {
            echo "doc-links<<EOF"
            printf '%s' "$LINKS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment (success)
        if: steps.download.outcome == 'success' && steps.deploy.outcome == 'success'
        uses: hibernate/.github/actions/upsert-pr-comment@865fcd72c2399d04a2e8a08b6d7e18ae39180975
        with:
          marker: '<!-- docs-preview -->'
          pr-number: ${{ needs.setup.outputs.pr-number }}
          content: |-
            ### Documentation Preview

            Preview deployed for commit ${{ needs.setup.outputs.head-sha }}:

            ${{ steps.links.outputs.doc-links }}

            _This preview will be removed when the PR is closed._

      - name: Post or update PR comment (artifact not found)
        if: steps.download.outcome == 'failure'
        uses: hibernate/.github/actions/upsert-pr-comment@865fcd72c2399d04a2e8a08b6d7e18ae39180975
        with:
          marker: '<!-- docs-preview -->'
          pr-number: ${{ needs.setup.outputs.pr-number }}
          content: |-
            ### Documentation Preview

            Documentation preview artifact not found for commit ${{ needs.setup.outputs.head-sha }}.
            The documentation may not have changed, or the artifact may have expired.

            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

      - name: Post or update PR comment (failure)
        if: steps.download.outcome == 'success' && steps.deploy.outcome == 'failure'
        uses: hibernate/.github/actions/upsert-pr-comment@865fcd72c2399d04a2e8a08b6d7e18ae39180975
        with:
          marker: '<!-- docs-preview -->'
          pr-number: ${{ needs.setup.outputs.pr-number }}
          content: |-
            ### Documentation Preview

            Preview deployment failed for commit ${{ needs.setup.outputs.head-sha }}.

            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

  report-check:
    name: Create CI report check
    needs: [setup, publish-build-scans, publish-sonar, deploy-docs-preview]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Update check run with report summary
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          CHECK_RUN_ID: ${{ needs.setup.outputs.check-run-id }}
          BUILD_SCANS_RESULT: ${{ needs.publish-build-scans.result }}
          BUILD_SCANS_PUBLISHED: ${{ needs.publish-build-scans.outputs.published }}
          BUILD_SCANS_FAILED: ${{ needs.publish-build-scans.outputs.failed }}
          SCAN_REPORT: ${{ needs.publish-build-scans.outputs.scan-report }}
          SONAR_RESULT: ${{ needs.publish-sonar.result }}
          SONAR_URL: ${{ needs.publish-sonar.outputs.sonar-url }}
          DOCS_RESULT: ${{ needs.deploy-docs-preview.result }}
          DOCS_URL: ${{ needs.deploy-docs-preview.outputs.deploy-url }}
          CI_WORKFLOW_URL: ${{ github.server_url }}/${{ github.event.workflow_run.repository.full_name }}/actions/runs/${{ github.event.workflow_run.id }}
          REPORTING_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const features = [];
            let summary = '';

            // Develocity Build Scans
            if (process.env.BUILD_SCANS_RESULT !== 'skipped') {
              const published = process.env.BUILD_SCANS_PUBLISHED || '0';
              const failed = process.env.BUILD_SCANS_FAILED || '0';
              const scanReport = (process.env.SCAN_REPORT || '').trim();

              features.push('build scans');
              summary += '### Develocity Build Scans\n\n';
              summary += `Published ${published} build scan(s)`;
              if (failed !== '0') {
                summary += `, ${failed} failed`;
              }
              summary += '\n\n';
              if (scanReport) {
                summary += scanReport + '\n\n';
              }
            }

            // Sonar Analysis
            if (process.env.SONAR_RESULT !== 'skipped') {
              features.push('Sonar');
              summary += '### Sonar Analysis\n\n';
              const sonarUrl = process.env.SONAR_URL;
              if (sonarUrl) {
                if (process.env.SONAR_RESULT === 'success') {
                  summary += `[View on SonarCloud](${sonarUrl})\n\n`;
                } else {
                  summary += `Analysis failed — [View on SonarCloud](${sonarUrl})\n\n`;
                }
              } else {
                summary += `Analysis ${process.env.SONAR_RESULT}\n\n`;
              }
            }

            // Documentation Preview
            if (process.env.DOCS_RESULT !== 'skipped') {
              features.push('docs preview');
              summary += '### Documentation Preview\n\n';
              const docsUrl = process.env.DOCS_URL;
              if (docsUrl) {
                summary += `[View preview](${docsUrl})\n\n`;
              } else if (process.env.DOCS_RESULT === 'success') {
                summary += 'No documentation artifact found.\n\n';
              } else {
                summary += 'Deployment failed.\n\n';
              }
            }

            // Links to workflow runs
            summary += '---\n';
            summary += `[CI workflow run](${process.env.CI_WORKFLOW_URL})`;
            summary += ` · [Reporting workflow run](${process.env.REPORTING_WORKFLOW_URL})`;
            summary += '\n';

            // Determine conclusion
            const results = [
              process.env.BUILD_SCANS_RESULT,
              process.env.SONAR_RESULT,
              process.env.DOCS_RESULT,
            ].filter(r => r && r !== 'skipped');
            const conclusion = results.some(r => r === 'failure') ? 'failure' : 'neutral';

            const title = features.length > 0
              ? `Reported: ${features.join(', ')}`
              : 'No reports configured';

            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: parseInt(process.env.CHECK_RUN_ID),
              status: 'completed',
              conclusion,
              output: {
                title,
                summary: summary || 'No CI reports were generated.',
              },
            });
